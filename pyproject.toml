[project]
name = "sqlserverbakrestorer"
version = "0.1.0a1"
authors = [{ name = "Leonardo Sextare" }]
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "flet>=0.86.5",
    "pydantic>=2.13.5",
    "python-tds>=1.17.1",
]

[project.scripts]
bakrestorer = "bakrestorer.desktop_shell.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.6",
    "testcontainers[mssql]>=4.15.0",
    "ty>=0.0.80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakrestorer"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/bakrestorer"]
# A interface fica fora da cobertura enquanto não tiver teste
omit = ["src/bakrestorer/desktop_shell/*", "src/bakrestorer/features/*/gui/*"]

[tool.coverage.report]
show_missing = true
