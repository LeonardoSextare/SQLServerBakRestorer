[project]
name = "sqlserverbakrestorer"
dynamic = ["version"]
authors = [{ name = "Leonardo Sextare" }]
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "flet>=0.86.5",
    "pydantic>=2.13.5",
    "python-tds>=1.17.1",
]

[dependency-groups]
dev = [
    "flet[cli]>=0.86.5",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.6",
    "testcontainers[mssql]>=4.15.0",
    "ty>=0.0.80",
]
docs = ["zensical>=0.0.69"]

[project.scripts]
bakrestorer = "bakrestorer.desktop_shell.main:run"

[tool.uv]
default-groups = "all"
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/bakrestorer/_versao.py"
template = '''
VERSAO = "{version}"
VERSAO_DECOMPOSTA = {version_tuple}
'''

[tool.hatch.build.targets.wheel]
packages = ["src/bakrestorer"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/bakrestorer"]
# A interface fica fora da cobertura enquanto não tiver teste
omit = [
    "src/bakrestorer/_versao.py",
    "src/bakrestorer/desktop_shell/*",
    "src/bakrestorer/features/*/gui/*",
]

[tool.coverage.report]
show_missing = true

[tool.flet]
product = "SQLServerBackupRestorer"
company = "Leonardo Sextare"
copyright = "Copyright (C) 2026 Leonardo Sextare"
build_number = 1

[tool.flet.app]
path = "src"
exclude = ["ruff.toml", ".ruff_cache"]
hide_window_on_start = true

[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"

[tool.flet.windows]
artifact = "SQLServerBackupRestorer"
