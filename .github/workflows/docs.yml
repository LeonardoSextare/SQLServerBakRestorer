name: Documentação

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - uv.lock
      - .github/workflows/docs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o uv e o Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"

      - name: Instalar o Zensical
        run: uv sync --locked --only-group docs

      - name: Montar o site
        run: uv run --no-sync zensical build --clean

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Guardar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar no Pages
        id: publicacao
        uses: actions/deploy-pages@v5
