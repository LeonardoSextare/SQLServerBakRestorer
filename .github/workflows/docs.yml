name: Documentação

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/**
      - zensical.toml
      - uv.lock
      - .github/workflows/docs.yml
      - .github/actions/preparar-ambiente/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente
        with:
          uv-sync-args: --only-group docs

      - name: Montar o site
        run: uv run zensical build --clean

      - name: Configurar o Pages
        uses: actions/configure-pages@v6

      - name: Guardar o site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publicar no Pages
        id: publicacao
        uses: actions/deploy-pages@v5
