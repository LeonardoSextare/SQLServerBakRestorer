name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  analise-estatica:
    name: Análise estática
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        id: ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Lint
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ruff check src tests --output-format=github --ignore FIX002

      - name: Formatação
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ruff format --check src tests --output-format=github

      - name: Tipos
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ty check src tests --output-format=github

  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Testes unitários
        run: uv run pytest tests/unit

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Testes de integração
        run: uv run pytest tests/integration
