name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analise-estatica:
    name: Análise estática
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        id: ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Lint
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ruff check src tests --output-format=github --ignore FIX002

      - name: Formatação
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ruff format --check src tests --output-format=github

      - name: Tipos
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ty check src tests --output-format=github

  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Testes unitários
        run: uv run pytest tests/unit -v --color=yes --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.unitarios

      - name: Guardar a cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-unitarios
          path: .coverage.unitarios
          include-hidden-files: true

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Testes de integração
        run: uv run pytest tests/integration -v --color=yes --cov --cov-report=
        env:
          COVERAGE_FILE: .coverage.integracao

      - name: Guardar a cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-integracao
          path: .coverage.integracao
          include-hidden-files: true

  cobertura:
    name: Cobertura
    needs: [testes-unitarios, testes-integracao]
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Baixar as medições
        uses: actions/download-artifact@v8
        with:
          pattern: cobertura-*
          merge-multiple: true

      - name: Juntar as medições
        run: uv run coverage combine

      - name: Mostrar o relatório
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
