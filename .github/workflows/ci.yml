name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analise-estatica:
    name: Análise estática
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        id: ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Lint
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ruff check src tests --output-format=github --ignore FIX002

      - name: Formatação
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ruff format --check src tests --output-format=github

      - name: Tipos
        if: ${{ !cancelled() && steps.ambiente.outcome == 'success' }}
        run: uv run ty check src tests --output-format=github

  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Testes unitários
        run: uv run pytest tests/unit -v --color=yes --cov --cov-report= --junitxml=resultado-unitarios.xml
        env:
          COVERAGE_FILE: .coverage.unitarios

      - name: Guardar os resultados
        uses: actions/upload-artifact@v7
        with:
          name: resultados-unitarios
          path: |
            .coverage.unitarios
            resultado-unitarios.xml
          include-hidden-files: true

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Testes de integração
        run: uv run pytest tests/integration -v --color=yes --cov --cov-report= --junitxml=resultado-integracao.xml
        env:
          COVERAGE_FILE: .coverage.integracao

      - name: Guardar os resultados
        uses: actions/upload-artifact@v7
        with:
          name: resultados-integracao
          path: |
            .coverage.integracao
            resultado-integracao.xml
          include-hidden-files: true

  relatorios:
    name: Relatórios
    needs: [testes-unitarios, testes-integracao]
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente

      - name: Baixar os resultados
        uses: actions/download-artifact@v8
        with:
          pattern: resultados-*
          merge-multiple: true

      - name: Juntar as medições
        run: uv run coverage combine

      - name: Mostrar o relatório
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Calcular as métricas dos badges
        id: metricas
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true

          $relatoriosJunit = Get-ChildItem -Path resultado-*.xml | ForEach-Object { [xml](Get-Content -Path $_) }
          $quantidadeDeTestes = ($relatoriosJunit.testsuites.testsuite.tests | Measure-Object -Sum).Sum

          $percentualDeCobertura = [int](uv run coverage report --format=total)

          Add-Content -Path $env:GITHUB_OUTPUT -Value "quantidade_de_testes=$quantidadeDeTestes"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "percentual_de_cobertura=$percentualDeCobertura"

      - name: Atualizar os badges
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ vars.GIST_ID }}
          QUANTIDADE_DE_TESTES: ${{ steps.metricas.outputs.quantidade_de_testes }}
          PERCENTUAL_DE_COBERTURA: ${{ steps.metricas.outputs.percentual_de_cobertura }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true

          function New-Badge([string] $Rotulo, [string] $Mensagem, [string] $Cor) {
              $badge = [ordered]@{ schemaVersion = 1; label = $Rotulo; message = $Mensagem; color = $Cor }
              return @{ content = $badge | ConvertTo-Json -Compress }
          }

          $quantidadeDeTestes = [int]$env:QUANTIDADE_DE_TESTES
          $percentualDeCobertura = [int]$env:PERCENTUAL_DE_COBERTURA

          $corDaCobertura =
              if ($percentualDeCobertura -ge 90) { "green" }
              elseif ($percentualDeCobertura -ge 70) { "yellow" }
              else { "red" }

          $arquivosDoGist = @{
              "sqlserverbakrestorer-testes.json"    = New-Badge -Rotulo "testes" -Mensagem "$quantidadeDeTestes" -Cor "green"
              "sqlserverbakrestorer-cobertura.json" = New-Badge -Rotulo "cobertura" -Mensagem "$percentualDeCobertura%" -Cor $corDaCobertura
          }

          $corpoDaRequisicao = @{ files = $arquivosDoGist } | ConvertTo-Json -Depth 3

          $corpoDaRequisicao | gh api --method PATCH "gists/$env:GIST_ID" --input -
