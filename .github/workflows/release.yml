name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar
    runs-on: windows-latest

    steps:
      - name: Baixar o código, com o histórico e as tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar o ambiente
        uses: ./.github/actions/preparar-ambiente
